services:
  postgres:
    image: postgres:16-alpine
    container_name: finora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finora_user
      POSTGRES_PASSWORD: finora_password
      POSTGRES_DB: finora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finora_user -d finora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: finora_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://finora_user:finora_password@postgres:5432/finora_db?schema=public
      JWT_SECRET: supersecret_jwt_key_finora_prod_2026
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: finora_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
